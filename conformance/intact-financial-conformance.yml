summary: >-
  Intact Financial publishes no machine-readable API contract, so no
  API-technology standard can be asserted from a spec. The meaningful
  conformance question for a Canadian P&C carrier is CSIO — the Centre for
  Study of Insurance Operations, the Canadian analogue of ACORD, whose EDI,
  XML, eDocs, Commercial Lines Data, Compliance (Z-code), API Security and JSON
  API standards govern broker-carrier connectivity. Intact Insurance is a CSIO
  member but appears on none of CSIO's certified-member lists and is recorded
  as "Not Yet Rated" on both the personal and commercial tracks of CSIO's 2026
  Standards Certification Ratings. A re-fetch of the certified-members page on
  2026-07-25 returned zero occurrences of "Intact", confirming the finding.
standards:
- id: csio-membership
  conforms: true
  evidence: >-
    Intact Insurance is listed in the CSIO member directory
    (https://csio.com/membership/member-directory).
- id: csio-json-api-standards
  conforms: false
