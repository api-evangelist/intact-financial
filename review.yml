        /.well-known/openid-configuration. A private/partner gateway, not a public API.
    - url: https://www.intactspecialty.com/
      status: 200
      note: US specialty arm. www.intactinsurance.com redirects here. No /api, /developers,
        /agents or /producers path (all 404).
