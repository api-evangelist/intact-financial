aid: intact-financial
name: Intact Financial
review:
  question: Does Intact Financial expose a public, self-serve developer portal or any
    downloadable API definition?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: Canada
  tier: carrier-pc
  specsHarvested: 0
findings:
  summary: |
    Intact Financial Corporation — Canada's largest property and casualty insurer —
    publishes no public API surface of any kind. There is no developer portal, no API
    reference, no downloadable OpenAPI/Swagger/GraphQL/AsyncAPI artifact, and no public
    Postman workspace on any Intact domain probed on 2026-07-25. Every candidate
    developer host on the primary corporate domain (intactfc.com) and the Canadian
    consumer/broker domain (intact.ca) either fails DNS resolution or returns 404.
    The only integration surfaces are authenticated login walls. Broker connectivity
    in Canada is not a carrier-published REST API at all; it is mediated through CSIO
    (Centre for Study of Insurance Operations), the Canadian insurance data-standards
    body whose EDI, XML, eDocs and JSON API standards are this market's analogue of
    ACORD, carried over the CSIOnet network and consumed inside broker management
    systems (Applied Epic/TAM, Vertafore SIG, Acturis, Rival TBW). Intact Insurance
    is listed in the CSIO member directory but appears on NONE of CSIO's certified
    member lists and is recorded as "Not Yet Rated" on CSIO's 2026 Standards
    Certification Ratings — a notable finding for the market's largest carrier, and
    a sharp contrast with peers Definity (Platinum) and Gore Mutual (Platinum).
  developerPortal:
    exists: false
    url: ''
    classification: none
    note: |
      No first-party developer portal exists. What Intact operates instead is a
      partner/agent login wall (classification b) plus a marketing innovation page
      (classification c). Both are recorded below.
