actions:
  openapiHarvested: false
  specsCount: 0
  apisYmlApis: 0
  gated: true
  reason: |
    Intact Financial is a correct and deliberate STUB. The largest P&C carrier in Canada
    publishes no self-serve API surface. Recording that honestly — with the CSIO
    "Not Yet Rated" signal attached — is the finding. apis[] is empty because there is
    nothing real to list, and openapi/ is omitted because nothing real was harvested.
