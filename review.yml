  specHunt:
    attempted:
      - https://api.intactspecialty.com/openapi.json
      - https://api.intactspecialty.com/swagger.json
      - https://api.intactspecialty.com/api-docs
      - https://api.intactspecialty.com/v1/openapi.json
    result: |
      All 404. No OpenAPI, Swagger, RAML, GraphQL SDL, .proto or AsyncAPI document was
      found on any Intact-controlled host. Zero specs harvested; the openapi/ directory
      is intentionally absent from this repo.
  acordPosture:
    phrase: No ACORD reference found; CSIO member but "Not Yet Rated" and on no CSIO
      certified list
    detail: |
      Canada's insurance data-standards body is CSIO (Centre for Study of Insurance
      Operations), not ACORD directly; CSIO publishes EDI, XML, eDocs, Commercial Lines
      and JSON API standards plus API Security Standards, and runs CSIOnet as the
      broker-carrier transport. A site search for "CSIO" on www.intact.ca returns zero
      results, and no ACORD, AL3, ACORD XML, NGDS or IVANS reference appears anywhere
      on intactfc.com, intact.ca or intactspecialty.com.
      Intact Insurance IS listed in the CSIO member directory
      (https://csio.com/membership/member-directory), but:
        - it appears on NO CSIO certified-member list — not API Security Standards
          Certified, not CL Data Standards Certified, not Compliance (Z-code) Certified,
          not eDocs Certified, and not JSON API Standards Certified
          (https://csio.com/csio-certification/certified-members, fetched 2026-07-25);
        - CSIO's 2026 Standards Certification Ratings record "Intact Insurance —
          Not Yet Rated / Not Yet Rated" on both the personal and commercial tracks
          (https://csio.com/standards-certification-ratings, fetched 2026-07-25).
      For contrast, Definity Financial and Gore Mutual are rated Platinum on the same
      table, and only Northbridge (FNOL) and Wawanesa (Billing) are certified against
      CSIO's JSON API Standards at all. Intact's broker connectivity therefore runs on
      legacy CSIO EDI/XML download into broker management systems and on the gated
      Intact Portal, not on a published, certified API.
  insuranceVerbs:
    quote:
      publicAPI: false
      note: Consumer quote funnels exist as web forms on intact.ca and belairdirect.com;
        no documented quote API. Broker rating happens inside the gated Intact Portal
        or via BMS/CSIO transport.
    bind:
      publicAPI: false
    issue:
      publicAPI: false
    fnol:
      publicAPI: false
      note: Claims are filed via web/app/phone or through a broker; no public FNOL API.
        Intact is not on CSIO's JSON API FNOL certified list.
    audience: partner-only (independent brokers) and consumer self-service; no
      third-party developer audience is served.
  authModel:
    scheme: Session-based web login only
    details: |
      Broker portal (portal.intactinsurance.com) is a Drupal form login. Customer Client
      Centre is fronted by IBM Security Access Manager / WebSEAL (TAM_OP=login). No
      OAuth2, no API keys, no mTLS documented publicly.
    wellKnown:
      - url: https://www.intact.ca/.well-known/openid-configuration
        status: 404
      - url: https://www.intactfc.com/.well-known/openid-configuration
        status: 404
      - url: https://portal.intactinsurance.com/.well-known/openid-configuration
        status: 404
      - url: https://api.intactspecialty.com/.well-known/oauth-authorization-server
        status: 404
  webhooks:
    documented: false
    note: No event catalog, no AsyncAPI, no webhook documentation. Absence is the finding.
  postman:
    public: false
    note: No public Postman workspace or collection found.
  graphql:
    documented: false
    note: https://www.intact.ca/graphql returns 404. No public GraphQL surface.
  grpc:
    documented: false
  sourceCode:
    githubOrganization: none
    note: |
      GitHub organizations intact-financial, intactfc, intactinsurance, intact-lab and
      intact-data-lab all return 404. No public source presence.
  transports:
    - protocol: HTTPS web application
      documented: true
      note: Marketing sites, consumer quote funnels, and two authenticated portals.
    - protocol: CSIO EDI / CSIO XML over CSIOnet
      documented: false
      note: |
        Industry-standard broker-carrier transport in Canada. Intact is a CSIO member but
        holds no CSIO certification and is Not Yet Rated, so the depth of its standards
        implementation is not publicly verifiable.
    - protocol: REST (public)
      documented: false
      note: No public REST API is documented on any Intact host.
    - protocol: GraphQL
      documented: false
    - protocol: WebSocket
      documented: false
